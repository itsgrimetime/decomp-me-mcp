[project]
name = "decomp-mcp-server"
version = "0.1.0"
description = "MCP server for interacting with decomp.me API"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decomp_mcp"]

[tool.uv]
dev-dependencies = []
